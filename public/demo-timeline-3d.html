    let currentIdx = 0; // 默认停靠 2015-2017 国家票务基石 (起点)

    // =========================================================================
    // Three.js 核心场景构建
    // =========================================================================
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 4000);

    // =========================================================================
    // 【主时间线光带 Shader】
    // =========================================================================
    const beamVertexShader = `
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying float vLocalX;
      void main() {
        vUv = uv;
        vLocalX = position.x;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const beamFragmentShader = `
      uniform float uTime;
      uniform float uProgress;
      uniform vec3 uColorCore;
      uniform vec3 uColorAmber;
      uniform vec3 uColorOrange;
      uniform vec3 uColorSmoke;
      uniform float uLayerOffset;
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying float vLocalX;

      vec2 hash2(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(dot(hash2(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0)),
              dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0)), u.x),
          mix(dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0)),
              dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0)), u.x), u.y
        );
      }

      void main() {
        float d = abs(vUv.y);
        if (d > 0.96) discard;

        float wX1 = vWorldPos.x * 0.045;
        float wX2 = vWorldPos.x * 0.095;
        float gravWave = 0.65 * sin(wX1 - uTime * 0.25 + uLayerOffset * 0.8) 
                       + 0.35 * sin(wX2 - uTime * 0.35 + 1.6);

        float edgeCurvatureWeight = smoothstep(0.05, 0.85, d);
        float waveDisplacement = gravWave * 0.20 * edgeCurvatureWeight;
        float wavyY = vUv.y + waveDisplacement;

        vec2 p = vec2(vWorldPos.x * 0.028 - uTime * 0.22 + uLayerOffset * 0.4, wavyY * 2.6);
        vec2 q = vec2(
          noise(p + vec2(0.0, -uTime * 0.08)),
          noise(p + vec2(3.6, 1.8) + vec2(0.0, uTime * 0.06))
        );
        vec2 r = vec2(
          noise(p + 2.6 * q + vec2(1.8, 4.5) - uTime * 0.06),
          noise(p + 2.6 * q + vec2(6.2, 2.1) + uTime * 0.05)
        );

        float nA = noise(p + 3.0 * r);
        float nB = noise(p * 2.5 + 1.8 * q);
        float ridgeA = 1.0 - abs(nA);
        float ridgeB = 1.0 - abs(nB);
        float plasma = (ridgeA * 0.65 + ridgeB * 0.35);
        plasma = pow(plasma, 1.4) * 1.35;

        float coreShift = (q.y * 0.12 + sin(vWorldPos.x * 0.032 - uTime * 0.16) * 0.035);
        float coreDist = abs(wavyY - coreShift);
        float coreThickness = 0.075 + 0.040 * ridgeA;
        float coreGlow = exp(-pow(coreDist / coreThickness, 2.2));
        float coreEnergy = coreGlow * (0.35 + 0.65 * ridgeA);

        float radialEnvelope = exp(-pow(d / 0.58, 2.0));
        float edgeSmoke = 0.82 + 0.18 * noise(vec2(vWorldPos.x * 0.016 - uTime * 0.10, wavyY * 1.6));
        float edgeCutoff = smoothstep(edgeSmoke, edgeSmoke - 0.25, d);
        float energy = plasma * radialEnvelope;

        vec3 colCrimson = vec3(0.58, 0.14, 0.03);
        vec3 colFire    = vec3(0.96, 0.40, 0.06);
        vec3 colAmber   = vec3(1.00, 0.72, 0.18);
        vec3 colCore    = vec3(1.00, 0.95, 0.78);

        vec3 col = mix(colCrimson, colFire, smoothstep(0.10, 0.52, energy));
        col = mix(col, colAmber, smoothstep(0.42, 0.88, energy));
        col = mix(col, colCore, clamp(coreEnergy * 0.84, 0.0, 0.90));

        float endFade = smoothstep(1000.0, 750.0, abs(vLocalX));
        float alpha = (energy * 0.50 + coreEnergy * 0.46) * edgeCutoff * endFade;
        float layerWeight = 0.69;

        gl_FragColor = vec4(col * alpha * layerWeight, alpha * layerWeight);
      }
    `;

    const beamGroup = new THREE.Group();
    scene.add(beamGroup);

    const BEAM_LENGTH = 2000;
    const BEAM_HEIGHT = 12;
    const beamUniforms = [];
    const numLayers = 3;
    const beamZOffsets = [-1.8, 0.0, 1.8];

    for (let i = 0; i < numLayers; i++) {
      const geo = new THREE.PlaneGeometry(BEAM_LENGTH, BEAM_HEIGHT, 320, 12);
      const uvAttr = geo.attributes.uv;

      const uniforms = {

        uColorAmber:  { value: new THREE.Color(0xf97316) },
        uColorOrange: { value: new THREE.Color(0xd9381e) },
        uColorSmoke:  { value: new THREE.Color(0x7c1d0f) },

      };
      beamUniforms.push(uniforms);

      const mat = new THREE.ShaderMaterial({

    // =========================================================================
    // 【包裹光雾 Shader】
    // =========================================================================
    const fogVertexShader = `
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying float vLocalX;
      uniform float uTime;
      uniform float uPhase;

      void main() {
        vUv = uv;
        vLocalX = position.x;
        vec3 pos = position;
        vec4 wp = modelMatrix * vec4(pos, 1.0);
        float waveY = sin(wp.x * 0.030 - uTime * 0.15 + uPhase) * 1.8;
        float waveZ = cos(wp.x * 0.022 - uTime * 0.12 + uPhase * 1.4) * 1.3;
        wp.y += waveY;
        wp.z += waveZ;
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const fogFragmentShader = `
      uniform float uTime;
      uniform float uProgress;
      uniform float uLayerOffset;
      uniform vec3 uColorInner;
      uniform vec3 uColorMid;
      uniform vec3 uColorOuter;
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying float vLocalX;

      vec2 hash2(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(dot(hash2(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0)),
              dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0)), u.x),
          mix(dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0)),
              dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0)), u.x), u.y
        );
      }

      void main() {
        float d = abs(vUv.y);
        if (d > 0.88) discard;

        float envelope = smoothstep(0.88, 0.16, d);
        float spinePass = smoothstep(0.0, 0.08, d) * 0.35 + 0.65;
        float fogConcentration = envelope * spinePass;

        vec2 p = vec2(vWorldPos.x * 0.015 - uTime * 0.075, vUv.y * 1.6 + uLayerOffset);
        vec2 q = vec2(
          noise(p + vec2(0.0, uTime * 0.030)),
          noise(p + vec2(3.8, 1.7) - uTime * 0.025)
        );
        float nA = noise(p + 2.2 * q);
        float nB = noise(p * 2.0 + 3.0 * q);
        float smokeField = (nA * 0.65 + nB * 0.35) * 0.5 + 0.5;

        float softMist = pow(smokeField, 1.30);
        float wideHaze = exp(-pow(d / 0.52, 2.0)) * 0.45;
        float totalMist = fogConcentration * softMist * 1.25 + wideHaze * fogConcentration * 0.50;

        vec3 col = mix(uColorOuter, uColorMid, smoothstep(0.10, 0.55, totalMist));
        col = mix(col, uColorInner, smoothstep(0.38, 0.88, totalMist) * (1.0 - d * 0.55));

        float endFade = smoothstep(1000.0, 750.0, abs(vLocalX));
        float alpha = clamp(totalMist * 0.825, 0.0, 0.95) * endFade;
        gl_FragColor = vec4(col * alpha * 1.5, alpha);
      }
    `;

    const fogGroup = new THREE.Group();
    scene.add(fogGroup);

    const FOG_LENGTH = 2000;
    const FOG_HEIGHT = 23;
    const fogUniforms = [];
    const numFogLayers = 2;

    for (let i = 0; i < numFogLayers; i++) {

      const uvAttr = geo.attributes.uv;

      const uniforms = {

    // =========================================================================
    // 【火星余烬微粒系统】
    // =========================================================================
    const emberVertexShader = `
      attribute vec4 aData;
      uniform float uTime;
      varying float vAlpha;
      varying float vSeed;

      void main() {
        vec3 pos = position;
        float speed = aData.z;
        float seed = aData.w;

        float flowX = mod(pos.x + uTime * speed * 4.2 + 1000.0, 2000.0) - 1000.0;
        pos.x = flowX;
        pos.y += sin(uTime * 0.8 + seed) * 0.8;
        pos.z += cos(uTime * 0.6 + seed * 1.2) * 0.6;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mvPosition;

        float sizeBase = (sin(seed * 4.3) * 0.5 + 0.5) * 3.4 + 1.8;
        gl_PointSize = sizeBase * (240.0 / -mvPosition.z);

        float endFade = smoothstep(1000.0, 750.0, abs(flowX));
        float flicker = sin(uTime * (2.2 + fract(seed * 7.3) * 3.0) + seed) * 0.40 + 0.60;
        float edgeFade = smoothstep(11.0, 1.5, abs(pos.y));
        vAlpha = flicker * edgeFade * endFade;
        vSeed = seed;
      }
    `;

    const emberFragmentShader = `
      varying float vAlpha;
      varying float vSeed;

      void main() {
        vec2 coord = gl_PointCoord - vec2(0.5);
        float r = length(coord) * 2.0;
        if (r > 1.0) discard;

        float intensity = exp(-r * r * 2.6);
        vec3 emberCol = mix(vec3(1.0, 0.48, 0.12), vec3(1.0, 0.82, 0.35), fract(vSeed * 13.7));
        if (fract(vSeed * 7.1) > 0.60) {
          emberCol = mix(emberCol, vec3(1.0, 0.98, 0.88), 0.85);
        }

        float finalAlpha = intensity * vAlpha * 2.025;
        gl_FragColor = vec4(emberCol * finalAlpha, finalAlpha);
      }
    `;

    const EMBER_COUNT = 1800;
    const emberGeo = new THREE.BufferGeometry();
    const emberPositions = new Float32Array(EMBER_COUNT * 3);
    const emberData = new Float32Array(EMBER_COUNT * 4);

    for (let i = 0; i < EMBER_COUNT; i++) {
      const x = (Math.random() - 0.5) * 2000;

      emberData[i * 4 + 0] = x;

    emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
    emberGeo.setAttribute('aData', new THREE.BufferAttribute(emberData, 4));

    const emberUniforms = { uTime: { value: 0 } };
    const emberMat = new THREE.ShaderMaterial({
      uniforms: emberUniforms,

    const emberPoints = new THREE.Points(emberGeo, emberMat);
    scene.add(emberPoints);

    // =========================================================================
    // 【突破 120% 空间螺旋流光线】
    // =========================================================================
    const helixVertexShader = `
      attribute float aRibbonSide;
      uniform float uTime;
      uniform float uRadius;
      uniform float uSpeed;
      uniform float uWavelength;
      uniform float uPhase;
      uniform float uTilt;
      uniform float uLifeSpeed;
      uniform float uLifeOffset;
      varying vec2 vUv;
      varying float vDepthZ;
      varying vec3 vWorldPos;
      varying float vEmergence;

      void main() {
        vUv = uv;
        vec3 pos = position;
        float worldX = pos.x + modelMatrix[3][0];

        float lifeCycle = fract(uTime * uLifeSpeed * 0.16 + uLifeOffset);
        float temporalLife = smoothstep(0.08, 0.32, lifeCycle) * smoothstep(0.92, 0.68, lifeCycle);

        float packetOffset = mod(worldX - uTime * uSpeed * 30.0 + uPhase * 90.0, 260.0) - 130.0;
        float spatialEnvelope = smoothstep(60.0, 10.0, abs(packetOffset));
        float endFade = smoothstep(1000.0, 750.0, abs(pos.x));

        float emergence = spatialEnvelope * temporalLife * endFade;
        vEmergence = emergence;

        float theta = worldX * uWavelength - uTime * uSpeed + uPhase;
        float currentRadius = uRadius * emergence;

        float helixY = sin(theta) * currentRadius;
        float helixZ = cos(theta) * currentRadius * 0.85 + sin(theta) * currentRadius * uTilt;

        vec3 centerPos = vec3(pos.x, helixY, helixZ);
        vec4 wp = modelMatrix * vec4(centerPos, 1.0);
        vWorldPos = wp.xyz;
        vDepthZ = helixZ;

        vec4 mvCenter = modelViewMatrix * vec4(centerPos, 1.0);
        mvCenter.y += aRibbonSide * (0.55 + 0.40 * emergence);
        gl_Position = projectionMatrix * mvCenter;
      }
    `;

    const helixFragmentShader = `
      uniform float uTime;
      uniform vec3 uColorHead;
      uniform vec3 uColorTail;
      varying vec2 vUv;
      varying float vDepthZ;
      varying vec3 vWorldPos;
      varying float vEmergence;

      void main() {
        if (vEmergence < 0.01) discard;

        float d = abs(vUv.y);
        float coreGlow = exp(-d * d * 4.2);
        float energyPulse = 0.70 + 0.30 * sin(vWorldPos.x * 0.09 - uTime * 2.4);

        vec3 col = mix(uColorTail, uColorHead, vEmergence);
        col *= energyPulse;

        float depthFactor = smoothstep(-15.0, 15.0, vDepthZ) * 0.45 + 0.55;
        float alpha = coreGlow * vEmergence * depthFactor * 0.85;
        gl_FragColor = vec4(col * alpha, alpha);
      }
    `;

    function createRibbonGeometry(length, segments) {
      const geo = new THREE.BufferGeometry();
      const numVerts = (segments + 1) * 2;
      const positions = new Float32Array(numVerts * 3);
      const uvs = new Float32Array(numVerts * 2);
      const ribbonSides = new Float32Array(numVerts);
      const indices = [];

      const halfLen = length / 2;
      const step = length / segments;

      for (let i = 0; i <= segments; i++) {
        const x = -halfLen + i * step;
        const u = i / segments;

        const idx1 = i * 2;
        positions[idx1 * 3 + 0] = x;
        positions[idx1 * 3 + 1] = 0;
        positions[idx1 * 3 + 2] = 0;
        uvs[idx1 * 2 + 0] = u;
        uvs[idx1 * 2 + 1] = -1.0;
        ribbonSides[idx1] = -1.0;

        const idx2 = i * 2 + 1;
        positions[idx2 * 3 + 0] = x;
        positions[idx2 * 3 + 1] = 0;
        positions[idx2 * 3 + 2] = 0;
        uvs[idx2 * 2 + 0] = u;
        uvs[idx2 * 2 + 1] = 1.0;
        ribbonSides[idx2] = 1.0;

        if (i < segments) {
          const a = idx1;
          const b = idx2;
          const c = (i + 1) * 2;
          const d = (i + 1) * 2 + 1;
          indices.push(a, b, c);
          indices.push(b, d, c);
        }
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geo.setAttribute('aRibbonSide', new THREE.BufferAttribute(ribbonSides, 1));
      geo.setIndex(indices);
      return geo;
    }

    const helixGroup = new THREE.Group();
    scene.add(helixGroup);

    const helixRibbonGeo = createRibbonGeometry(2000, 600);
    const helixUniformsList = [];

    const helixConfigs = [
      { radius: 7.1, speed: 1.15, wavelength: 0.058, phase: 0.0, tilt: 0.12, lifeSpeed: 1.25, lifeOffset: 0.0, head: 0xf97316, tail: 0xffedd5 },
      { radius: 6.9, speed: 0.95, wavelength: 0.048, phase: 1.9, tilt: -0.15, lifeSpeed: 1.05, lifeOffset: 0.33, head: 0xfb923c, tail: 0xffedd5 },
      { radius: 7.2, speed: 0.80, wavelength: 0.040, phase: 3.6, tilt: 0.20, lifeSpeed: 0.90, lifeOffset: 0.66, head: 0xd9381e, tail: 0xffedd5 },
      { radius: 6.8, speed: 1.05, wavelength: 0.052, phase: 5.2, tilt: -0.10, lifeSpeed: 1.15, lifeOffset: 0.50, head: 0xf59e0b, tail: 0xffedd5 }
    ];

    helixConfigs.forEach(cfg => {
      const uniforms = {
        uTime:       { value: 0 },
        uRadius:     { value: cfg.radius },
        uSpeed:      { value: cfg.speed },
        uWavelength: { value: cfg.wavelength },
        uPhase:      { value: cfg.phase },
        uTilt:       { value: cfg.tilt },
        uLifeSpeed:  { value: cfg.lifeSpeed },
        uLifeOffset: { value: cfg.lifeOffset },
        uColorHead:  { value: new THREE.Color(cfg.head) },
        uColorTail:  { value: new THREE.Color(cfg.tail) }
      };
      helixUniformsList.push(uniforms);

      const mat = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: helixVertexShader,
        fragmentShader: helixFragmentShader,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(helixRibbonGeo, mat);
      mesh.renderOrder = 2;
      helixGroup.add(mesh);
    });

    // =========================================================================
    // 【时空共振能量枢纽节点 (Chrono-Nexus Node)】
    // 核心组件：能量核球、高维晶格骨架、光晕 Sprite、浮空标牌、射线碰撞球
    // =========================================================================
    const milestoneGroup = new THREE.Group();
    scene.add(milestoneGroup);

    // 预渲染柔光能量光晕材质（全局复用）
    function createAuraTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      g.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      g.addColorStop(0.2, 'rgba(254, 240, 138, 0.80)');
      g.addColorStop(0.45, 'rgba(245, 158, 11, 0.40)');
      g.addColorStop(0.7, 'rgba(217, 119, 6, 0.12)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(c);
    }
    const auraTexture = createAuraTexture();

    // 生成与时间线 100% 对齐的悬浮发光卡片
    function createMilestoneSprite(yearText, nameText, colorHex) {
      const c = document.createElement('canvas');
      c.width = 360;
      c.height = 150;
      const ctx = c.getContext('2d');

      const hexStr = `#${colorHex.toString(16).padStart(6, '0')}`;

      // 1. 半透明高科技深蓝毛玻璃底色 (提高到 80% 透明度，即 20% alpha，通透轻盈且字体高对比度)
      ctx.fillStyle = 'rgba(8, 14, 26, 0.20)';
      ctx.beginPath();
      ctx.roundRect(10, 10, 340, 130, 22);
      ctx.fill();

      // 2. 发光霓虹边框
      ctx.strokeStyle = hexStr;
      ctx.lineWidth = 3.2;
      ctx.shadowColor = hexStr;
      ctx.shadowBlur = 14;
      ctx.stroke();

      // 3. 年份大字 (纯白 monospace)
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(yearText, 180, 64);

      // 4. 战役主题标签 (彩色粗体)
      ctx.fillStyle = hexStr;
      ctx.font = 'bold 23px sans-serif';
      ctx.fillText(nameText, 180, 110);

      const tex = new THREE.CanvasTexture(c);
      const spriteMat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        depthWrite: false, // 彻底杜绝深度缓冲裁剪时间线
        depthTest: true,
        blending: THREE.NormalBlending
      });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(15, 6.25, 1);
      sprite.renderOrder = 25; // 确保置顶渲染，360度全视角绝不发生遮挡与变色
      return sprite;
    }

    const milestoneMeshes = [];

    PROJECTS.forEach((p, idx) => {
      const g = new THREE.Group();
      g.position.set(p.xPos, 0, 0);

      // 1. 柔和温暖的金色等离子能量晕 (Volumetric Golden Aura)
      const auraMat = new THREE.SpriteMaterial({
        map: auraTexture,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.82
      });
      const auraSprite = new THREE.Sprite(auraMat);
      auraSprite.scale.set(11, 11, 1);
      auraSprite.renderOrder = 14;
      g.add(auraSprite);

      // 2. 核心星核 (Core Plasma Orb)
      const coreGeo = new THREE.SphereGeometry(1.4, 24, 24);
      const coreMat = new THREE.MeshBasicMaterial({
        color: p.accentColor,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });
      const coreOrb = new THREE.Mesh(coreGeo, coreMat);
      coreOrb.renderOrder = 15;
      g.add(coreOrb);

      // 3. 高维几何晶格骨架 (Icosahedron Crystal Cage) - 纯几何多面体，无圆形线条
      const crystalGeo = new THREE.IcosahedronGeometry(2.3, 0);
      const crystalWire = new THREE.WireframeGeometry(crystalGeo);
      const crystalMat = new THREE.LineBasicMaterial({
        color: p.accentColor,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending
      });
      const crystalCage = new THREE.LineSegments(crystalWire, crystalMat);
      crystalCage.renderOrder = 16;
      g.add(crystalCage);

      // 4. 悬浮时间全息标牌 (Y = 7.8，80% 背景透明度，可点击触发同等效果)
      const sprite = createMilestoneSprite(p.year, p.timelineBadge, p.accentColor);
      sprite.position.set(0, 7.8, 0);
      sprite.userData = { milestoneIndex: idx };
      g.add(sprite);

      // 5. 射线检测碰撞球 (半径 5.8，覆盖中心能量核心)
      const hitGeo = new THREE.SphereGeometry(5.8, 12, 12);
      const hitMat = new THREE.MeshBasicMaterial({ visible: false });
      const hitMesh = new THREE.Mesh(hitGeo, hitMat);
      hitMesh.material.depthWrite = false;
      hitMesh.userData = { milestoneIndex: idx };
      g.add(hitMesh);

      milestoneGroup.add(g);
      milestoneMeshes.push({
        idx,
        xPos: p.xPos,
        group: g,
        coreOrb,
        crystalCage,
        auraSprite,
        sprite,
        hitMesh,
        accentColor: p.accentColor
      });
    });

    // 获取所有可供射线拾取的 3D 目标（包含节点碰撞球与浮空标题标牌）
    function getInteractiveTargets() {
      const targets = [];
      milestoneMeshes.forEach(item => {
        if (item.hitMesh) targets.push(item.hitMesh);
        if (item.sprite) targets.push(item.sprite);
      });
      return targets;
    }

    // =========================================================================
    // 【HUD 与底部导轨联动控制】
    // =========================================================================
    function warpToMilestone(idx) {
      if (idx < 0 || idx >= PROJECTS.length) return;
      currentIdx = idx;

      // 核心需求：点击节点或标牌时，若看板当前为收起状态，自动平滑展开看板
      if (isHudCollapsed) {
        toggleHUD();
      }

      updateHUD();
    }

    function stepMilestone(dir) {
      // 核心需求：滑动到最后一个节点时，不会再回到第一个节点；到达两端停止
      const next = Math.max(0, Math.min(PROJECTS.length - 1, currentIdx + dir));
      if (next !== currentIdx) {
        warpToMilestone(next);
      }
    }

    function renderStepper() {
      const stepper = document.getElementById('timeline-stepper');
      // 严格从左到右由早到晚 (2015 -> 2023)
      stepper.innerHTML = PROJECTS.map((p, idx) => {
        const isActive = idx === currentIdx;
        const colorHex = `#${p.accentColor.toString(16).padStart(6, '0')}`;
        return `
          <button 
            onclick="warpToMilestone(${idx})"
            class="group flex flex-col items-center cursor-pointer transition-all p-1.5 rounded-xl ${
              isActive ? 'bg-amber-500/25 border shadow-lg' : 'hover:bg-slate-800/50 border border-transparent'
            }"
            style="${isActive ? `border-color: ${colorHex}; box-shadow: 0 0 16px ${colorHex}66;` : ''}"
          >
            <div class="flex items-center gap-1.5">
              <span class="w-2.5 h-2.5 rounded-full transition-all" style="background-color: ${colorHex}; ${isActive ? `box-shadow: 0 0 10px ${colorHex};` : ''}"></span>
              <span class="text-[10px] font-mono font-bold text-slate-300">${p.code}</span>
            </div>
            <span class="text-[10px] font-mono font-bold mt-1 truncate max-w-[85px] ${isActive ? 'text-amber-200 font-black' : 'text-slate-400'}">
              ${p.year}
            </span>
          </button>
        `;
      }).join('');
    }

    function updateHUD() {
      const p = PROJECTS[currentIdx];
      renderStepper();

      const colorHex = `#${p.accentColor.toString(16).padStart(6, '0')}`;

      // 阶段与战役标头 (无任何漫威宝石文字)
      const stageCodeEl = document.getElementById('hudStageCode');
      stageCodeEl.innerText = `STAGE // ${p.code}`;
      stageCodeEl.style.borderColor = `${colorHex}88`;
      stageCodeEl.style.color = colorHex;
      stageCodeEl.style.backgroundColor = `${colorHex}1a`;

      const badgeEl = document.getElementById('hudBadge');
      badgeEl.innerText = p.timelineBadge;
      badgeEl.style.borderColor = `${colorHex}66`;
      badgeEl.style.color = colorHex;
      badgeEl.style.backgroundColor = `${colorHex}14`;

      document.getElementById('hudPeriod').innerText = p.period;
      document.getElementById('hudTitle').innerText = p.title;
      document.getElementById('hudCompany').innerText = p.fullName;
      document.getElementById('hudRole').innerText = p.role;
      document.getElementById('hudLocation').innerText = p.location;
      document.getElementById('hudSlogan').innerText = p.slogan;

      document.getElementById('progressPercent').innerText = `${p.year} (${currentIdx + 1} / 6)`;

      // 背景光晕色彩联动
      const glowBg = document.getElementById('hudGlowBg');
      glowBg.style.backgroundColor = `${colorHex}22`;

      // 4 大核心指标
      const metricsGrid = document.getElementById('hudMetricsGrid');
      metricsGrid.innerHTML = p.metrics.map(m => `
        <div class="p-2.5 rounded-xl bg-slate-900/80 border border-amber-500/20 shadow-inner">
          <div class="text-xl sm:text-2xl font-black font-mono gold-glow-text leading-none mb-1" style="color: ${colorHex};">
            ${m.val}
          </div>
          <div class="text-[10px] font-mono font-bold text-slate-200 uppercase tracking-wide">
            ${m.lbl}
          </div>
          <div class="text-[9px] text-slate-400 mt-0.5 leading-tight">
            ${m.desc}
          </div>
        </div>
      `).join('');

      // 深度架构攻坚章节
      const chaptersList = document.getElementById('hudChaptersList');
      chaptersList.innerHTML = p.deepChapters.map(ch => `
        <div class="p-2.5 rounded-xl bg-slate-900/70 border border-amber-500/15 text-xs">
          <h4 class="font-bold font-mono flex items-center gap-1.5 mb-1" style="color: ${colorHex};">
            <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${colorHex}; box-shadow: 0 0 6px ${colorHex};"></span>
            ${ch.title}
          </h4>
          <p class="text-slate-300 text-[11px] leading-relaxed pl-3 border-l border-amber-500/30">
            ${ch.desc}
          </p>
        </div>
      `).join('');

      // 技术栈
      const techStack = document.getElementById('hudTechStack');
      techStack.innerHTML = p.techStack.map(t => `
        <span class="px-2 py-0.5 rounded-md text-[10px] font-mono font-semibold bg-amber-500/15 border border-amber-500/30 text-amber-200">
          ${t}
        </span>
      `).join('');
    }

    // 看板收起/展开切换（ESC 键触发）
    function toggleHUD() {
      const hud = document.getElementById('dossier-hud');
      isHudCollapsed = !isHudCollapsed;
      if (isHudCollapsed) {
        hud.classList.add('translate-x-[110%]', 'opacity-0', 'pointer-events-none');
      } else {
        hud.classList.remove('translate-x-[110%]', 'opacity-0', 'pointer-events-none');
      }
    }

    // =========================================================================
    // 摄像机交互控制器 (鼠标滚轮切换战役节点；拖拽视角；放大功能保留待命)
    // =========================================================================
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };
    let dragStartPos = { x: 0, y: 0 };

    let orbitTheta = 1.030;
    let orbitPhi = 0.020;
    let targetOrbitTheta = 1.030;
    let targetOrbitPhi = 0.020;

    const ENABLE_ZOOM = false; // 保留待命
    let distance = 70;
    let targetDistance = 70;

    function applyZoom(delta) {
      targetDistance = Math.max(18, Math.min(260, targetDistance + delta));
    }

    const raycaster = new THREE.Raycaster();
    const mouseCoord = new THREE.Vector2();

    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#dossier-hud') || e.target.closest('nav')) {
        return;
      }
      isDragging = true;
      prevMouse = { x: e.clientX, y: e.clientY };
      dragStartPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('mousemove', (e) => {
      mouseCoord.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseCoord.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (isDragging) {
        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;
        prevMouse = { x: e.clientX, y: e.clientY };

        targetOrbitTheta -= dx * 0.005;
        targetOrbitPhi = Math.max(-1.1, Math.min(1.1, targetOrbitPhi + dy * 0.005));
      } else {
        if (!e.target.closest('#dossier-hud') && !e.target.closest('nav')) {
          raycaster.setFromCamera(mouseCoord, camera);
          const interactiveTargets = getInteractiveTargets();
          const intersects = raycaster.intersectObjects(interactiveTargets);
          if (intersects.length > 0) {
            canvas.style.cursor = 'pointer';
          } else {
            canvas.style.cursor = 'grab';
          }
        }
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const dragDist = Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y);

      // 位移小于 5px 判定为点击 3D 节点或浮空标牌
      if (dragDist < 5) {
        mouseCoord.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouseCoord.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouseCoord, camera);
        const interactiveTargets = getInteractiveTargets();
        const intersects = raycaster.intersectObjects(interactiveTargets);
        if (intersects.length > 0) {
          const hitIdx = intersects[0].object.userData.milestoneIndex;
          warpToMilestone(hitIdx);
        }
      }
    });

    // =========================================================================
    // 【核心需求 4】：鼠标滚轮完全控制前后切换节点
    // =========================================================================
    let wheelThrottleTimer = 0;
    window.addEventListener('wheel', (e) => {
      // 若鼠标在右侧看板内部，允许文章深度内容自然垂直滚动浏览，不触发切节点
      if (e.target && e.target.closest('#dossier-hud')) return;

      e.preventDefault();

      const now = Date.now();
      // 设置 280ms 节流，确保滚轮单格滚动手感清脆利落、不连续跳跃
      if (now - wheelThrottleTimer < 280) return;

      if (Math.abs(e.deltaY) > 12) {
        wheelThrottleTimer = now;
        const dir = e.deltaY > 0 ? 1 : -1; // 滚轮向后滚动向后推进战役，向前滚动向前回溯
        stepMilestone(dir);
      }

      // 缩放功能完整保留待命
      if (ENABLE_ZOOM) {
        applyZoom(e.deltaY * 0.08);
      }
    }, { passive: false });

    // 触摸手势支持
    let touchStartDist = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#dossier-hud') || e.target.closest('nav')) return;
      if (e.touches.length === 1) {
        isDragging = true;
        prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        dragStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStartDist = Math.hypot(dx, dy);
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.target.closest('#dossier-hud')) return;
      if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - prevMouse.x;
        const dy = e.touches[0].clientY - prevMouse.y;
        prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        targetOrbitTheta -= dx * 0.006;
        targetOrbitPhi = Math.max(-1.1, Math.min(1.1, targetOrbitPhi + dy * 0.006));
      } else if (e.touches.length === 2 && ENABLE_ZOOM) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const factor = touchStartDist / dist;
        touchStartDist = dist;
        targetDistance = Math.max(18, Math.min(260, targetDistance * factor));
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      isDragging = false;
      if (e.changedTouches.length === 1) {
        const t = e.changedTouches[0];
        const dragDist = Math.hypot(t.clientX - dragStartPos.x, t.clientY - dragStartPos.y);
        if (dragDist < 6) {
          mouseCoord.x = (t.clientX / window.innerWidth) * 2 - 1;
          mouseCoord.y = -(t.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouseCoord, camera);
          const interactiveTargets = getInteractiveTargets();
          const intersects = raycaster.intersectObjects(interactiveTargets);
          if (intersects.length > 0) {
            const hitIdx = intersects[0].object.userData.milestoneIndex;
            warpToMilestone(hitIdx);
          }
        }
      }
    });

    // 键盘支持
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        stepMilestone(-1);
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        stepMilestone(1);
      } else if (e.key === 'Escape') {
        toggleHUD();
      }
    });

    // =========================================================================
    // 渲染主循环
    // =========================================================================
    const clock = new THREE.Clock();
    let currentTrackingX = PROJECTS[0].xPos;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();
      const flowTime = elapsed * 1.5;

      // 1. 更新主光带、光雾与余烬流光
      beamUniforms.forEach(u => { u.uTime.value = flowTime; });
      fogUniforms.forEach(u => { u.uTime.value = flowTime; });
      emberUniforms.uTime.value = flowTime;
      helixUniformsList.forEach(u => u.uTime.value = flowTime);

      // 2. 更新 3D 时空共振能量枢纽（晶格自转与柔和呼吸）
      const slowBreath = 1.0 + Math.sin(flowTime * 0.35) * 0.05;

      milestoneMeshes.forEach((item) => {
        const isActive = item.idx === currentIdx;

        // 高维晶格多轴轻柔自转
        item.crystalCage.rotation.x += 0.006;
        item.crystalCage.rotation.y += 0.009;

        // 能量核与光晕呼吸加权
        const targetScale = isActive ? 1.18 : 0.85;
        const breathScale = targetScale * slowBreath;
        item.coreOrb.scale.set(breathScale, breathScale, breathScale);
        item.auraSprite.scale.set(11 * breathScale, 11 * breathScale, 1);

        // 浮空标牌轻柔浮沉
        item.sprite.position.y = 7.8 + Math.sin(flowTime * 0.5 + item.idx) * 0.25;
      });

      // 3. 缓动更新相机：精准将当前选中的黑洞聚焦在左侧黄金视野区，完美避开右侧看板
      const targetX = PROJECTS[currentIdx].xPos;
      currentTrackingX += (targetX - currentTrackingX) * 0.08;

      orbitTheta += (targetOrbitTheta - orbitTheta) * 0.08;
      orbitPhi += (targetOrbitPhi - orbitPhi) * 0.08;
      distance += (targetDistance - distance) * 0.08;

      const offsetDist = isHudCollapsed ? 0 : -18;
      const camCenterX = currentTrackingX + offsetDist;
      
      const camX = camCenterX + distance * Math.sin(orbitTheta) * Math.cos(orbitPhi);
      const camY = 4.5 + distance * Math.sin(orbitPhi) + Math.sin(elapsed * 0.3) * 0.25;
      const camZ = distance * Math.cos(orbitTheta) * Math.cos(orbitPhi);

      camera.position.set(camX, camY, camZ);
      camera.lookAt(currentTrackingX + (isHudCollapsed ? 0 : 8), 1.2, 0);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 初始化渲染
    renderStepper();
    updateHUD();
  </script>
</body>
</html>
